<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="세계 여러 지역의 생활 모습을 조사하고 존중하는 대화를 배우는 초등 6학년 사회과 교육게임" />
  <!-- 카톡·SNS 크롤러는 상대경로를 못 읽는다 — og 계열은 절대 URL로 둔다 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="세계를 잇는 여행" />
  <meta property="og:url" content="https://world-connection-journey.vercel.app/" />
  <meta property="og:title" content="세계를 잇는 여행" />
  <meta property="og:description" content="지도·자료·리듬·대화로 세계를 연결하는 여행" />
  <meta property="og:image" content="https://world-connection-journey.vercel.app/assets/og.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="세계를 잇는 여행" />
  <meta name="twitter:description" content="지도·자료·리듬·대화로 세계를 연결하는 여행" />
  <meta name="twitter:image" content="https://world-connection-journey.vercel.app/assets/og.jpg" />
  <title>세계를 잇는 여행</title>
  <link rel="icon" type="image/webp" href="./assets/favicon.webp" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div id="app">
    <main id="scene-root" aria-live="polite"></main>
    <div id="overlay-root"></div>
  </div>
  <!-- 부팅 스플래시: 외부 요청 없이 인라인 스타일만 사용. main.ts가 진행률을 갱신하고 첫 화면 준비 후 제거한다. -->
  <div id="boot-splash" role="status" style="position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;padding:clamp(36px,9vh,96px) 24px 24px;background:linear-gradient(rgba(10,38,62,.2),rgba(10,38,62,.54)),url('/assets/bg_title.webp') center/cover;color:#FFFDF4;font-family:'Jua','Pretendard',sans-serif;transition:opacity .35s ease">
    <img src="./assets/title_logo.webp" alt="세계를 잇는 여행" style="width:min(60vw,560px);max-height:150px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(7,28,48,.4))">
    <div style="width:min(64vw,360px);height:12px;padding:2px;border:1px solid rgba(255,255,255,.6);border-radius:999px;background:rgba(12,43,69,.35);overflow:hidden;box-shadow:0 10px 24px rgba(7,28,48,.18);backdrop-filter:blur(8px)">
      <div id="boot-bar" style="width:8%;height:100%;border-radius:999px;background:#F2C14E;transition:width .3s ease"></div>
    </div>
    <p id="boot-msg" style="margin:0;padding:7px 16px;border-radius:999px;background:rgba(12,43,69,.48);font-size:1rem;font-weight:700;box-shadow:0 8px 20px rgba(7,28,48,.16);backdrop-filter:blur(8px)">여행을 준비하고 있어요...</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
